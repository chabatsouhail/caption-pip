<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Caption PiP test page</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; }
      body { margin: 0; padding: 32px; background: #12121a; color: #f7f5ff; }
      main { width: min(900px, 100%); margin: auto; }
      h1 { margin-top: 0; }
      .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(310px, 1fr)); gap: 24px; }
      figure { margin: 0; padding: 12px; border: 1px solid #343243; border-radius: 16px; background: #1b1a25; }
      video, iframe { display: block; width: 100%; aspect-ratio: 16 / 9; border: 0; border-radius: 10px; background: #050507; }
      .player-shell { position: relative; width: 100%; aspect-ratio: 16 / 9; }
      .player-shell video { position: absolute; top: 50%; left: 50%; height: 100%; transform: translate(-50%, -50%); }
      .fixture-player-controls {
        position: absolute;
        right: 12px;
        bottom: 12px;
        z-index: 2;
        opacity: 0;
        transition: opacity 120ms ease;
      }
      .player-shell:hover .fixture-player-controls,
      .player-shell:focus-within .fixture-player-controls,
      .player-shell:fullscreen .fixture-player-controls { opacity: 1; }
      .fixture-fullscreen {
        display: grid;
        place-items: center;
        width: 38px;
        height: 38px;
        padding: 0;
        border: 0;
        border-radius: 6px;
        color: white;
        background: rgba(15, 15, 22, .78);
        cursor: pointer;
      }
      .fixture-fullscreen svg {
        width: 21px;
        height: 21px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .player-shell:fullscreen {
        width: 100vw;
        height: 100vh;
        aspect-ratio: auto;
        background: #050507;
      }
      .player-shell:fullscreen video {
        width: 100%;
        height: 100%;
        border-radius: 0;
        object-fit: contain;
      }
      figcaption { padding: 10px 2px 2px; color: #aaa5b8; font-size: 13px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Caption PiP browser fixture</h1>
      <p>Both players are generated locally. No media is downloaded.</p>
      <div class="grid">
        <figure>
          <div class="player-shell">
            <video id="regular-video" autoplay muted loop playsinline></video>
            <div class="fixture-player-controls">
              <button type="button" class="fixture-fullscreen" aria-label="Enter fullscreen">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M4 8v-2a2 2 0 0 1 2-2h2"></path>
                  <path d="M4 16v2a2 2 0 0 0 2 2h2"></path>
                  <path d="M16 4h2a2 2 0 0 1 2 2v2"></path>
                  <path d="M16 20h2a2 2 0 0 0 2-2v-2"></path>
                </svg>
              </button>
            </div>
          </div>
          <figcaption>Top-level video with TextTrack captions</figcaption>
        </figure>
        <figure>
          <iframe id="embedded-player" allow="autoplay; picture-in-picture"></iframe>
          <figcaption>Cross-origin embedded-player path</figcaption>
        </figure>
      </div>
    </main>
    <script src="fixture-video.js"></script>
    <script>
      document.querySelector("iframe").src = `http://localhost:${location.port}/embed.html`;
      makeFixtureVideo(document.querySelector("video"), "Top-level player");
      const playerShell = document.querySelector(".player-shell");
      const fixtureFullscreen = document.querySelector(".fixture-fullscreen");
      window.__fixtureFullscreenClicks = 0;
      fixtureFullscreen.addEventListener("click", () => {
        window.__fixtureFullscreenClicks += 1;
        if (document.fullscreenElement === playerShell) {
          document.exitFullscreen().catch(() => {});
          return;
        }
        playerShell.requestFullscreen({ navigationUI: "hide" }).catch(() => {});
      });
      document.addEventListener("fullscreenchange", () => {
        fixtureFullscreen.setAttribute(
          "aria-label",
          document.fullscreenElement === playerShell ? "Exit fullscreen" : "Enter fullscreen",
        );
      });
    </script>
  </body>
</html>
